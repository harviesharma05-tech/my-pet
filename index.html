<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mera Pet 🍌</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: linear-gradient(180deg, #fff1e6, #ffe0ec);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #app {
    display: flex; flex-direction: column;
    height: 100%; max-width: 480px; margin: 0 auto;
    position: relative;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(6px);
  }
  header .left { display: flex; align-items: center; gap: 10px; }
  header svg { width: 40px; height: 40px; }
  header h1 { font-size: 16px; margin: 0; color: #4a3f35; }
  header .sub { font-size: 11px; color: #a08f7d; }
  #gearBtn, #notifBtn {
    background: rgba(255,255,255,0.8); border: none; border-radius: 50%;
    width: 34px; height: 34px; font-size: 15px; cursor: pointer; margin-left: 6px;
  }

  #chatArea {
    flex: 1; overflow-y: auto; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .msg { max-width: 78%; padding: 9px 13px; border-radius: 16px; font-size: 13.5px; line-height: 1.4; }
  .pet-msg { align-self: flex-start; background: #fff; border: 2px solid #222; border-bottom-left-radius: 4px; }
  .user-msg { align-self: flex-end; background: #F7D354; border: 2px solid #222; border-bottom-right-radius: 4px; }
  .system-msg { align-self: center; font-size: 11px; color: #a08f7d; padding: 4px; }

  #inputBar {
    display: flex; gap: 8px; padding: 12px 16px;
    background: rgba(255,255,255,0.7);
  }
  #textInput {
    flex: 1; border: 2px solid #222; border-radius: 20px;
    padding: 9px 14px; font-size: 13.5px; outline: none;
  }
  #sendBtn {
    border: 2px solid #222; background: #F7D354; border-radius: 50%;
    width: 40px; height: 40px; cursor: pointer; font-size: 16px;
  }

  /* Settings panel */
  #overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.35);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  #overlay.show { display: flex; }
  #panel {
    background: #fffaf3; border-radius: 18px; padding: 20px;
    width: 85%; max-width: 360px; max-height: 80%; overflow-y: auto;
    border: 2px solid #222;
  }
  #panel h2 { font-size: 16px; margin-top: 0; }
  #panel label { display: block; font-size: 12px; color: #6b5c4d; margin: 10px 0 4px; }
  #panel input, #panel select {
    width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid #ddd; font-size: 13px;
  }
  #panel .row { display: flex; gap: 8px; }
  #panel button.primary {
    margin-top: 16px; width: 100%; padding: 10px; border-radius: 12px;
    border: 2px solid #222; background: #F7D354; font-weight: bold; cursor: pointer;
  }
  #panel .hint { font-size: 11px; color: #a08f7d; margin-top: 4px; }
  #closePanel { float: right; background: none; border: none; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="left">
      <svg viewBox="0 0 120 120"><ellipse cx="60" cy="70" rx="34" ry="42" fill="#F7D354" stroke="#3a3a3a" stroke-width="3"/><path d="M40 30 Q55 5 75 20" fill="none" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/><circle cx="48" cy="65" r="4" fill="#222"/><circle cx="72" cy="65" r="4" fill="#222"/><path d="M50 82 Q60 90 70 82" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/></svg>
      <div>
        <h1 id="petTitle">Tumhara Pet 🍌</h1>
        <div class="sub" id="petSub">Hamesha tumhare saath hai</div>
      </div>
    </div>
    <div>
      <button id="notifBtn" title="Notifications on/off">🔔</button>
      <button id="gearBtn" title="Settings">⚙️</button>
    </div>
  </header>

  <div id="chatArea"></div>

  <div id="inputBar">
    <input id="textInput" type="text" placeholder="Kuch likho..." />
    <button id="sendBtn">➤</button>
  </div>

  <div id="overlay">
    <div id="panel">
      <button id="closePanel">✕</button>
      <h2>Settings ⚙️</h2>

      <label>Tumhara naam</label>
      <input id="userName" type="text" placeholder="e.g. Harvi" />

      <label>Gender (reminders customize karne ke liye)</label>
      <select id="userGender">
        <option value="">Batana nahi hai</option>
        <option value="female">Ladki</option>
        <option value="male">Ladka</option>
      </select>

      <div id="periodFields" style="display:none;">
        <label>Last period ki start date</label>
        <input id="lastPeriod" type="date" />
        <label>Average cycle length (days)</label>
        <input id="cycleLength" type="number" value="28" min="20" max="45" />
      </div>

      <label>Paani peene ka reminder (har kitne ghante me)</label>
      <input id="waterHours" type="number" value="2" min="1" max="6" />

      <label>Claude API Key (chat ke liye — sirf tumhare browser me save hoga, kahin aur nahi)</label>
      <input id="apiKey" type="password" placeholder="sk-ant-..." />
      <div class="hint">console.anthropic.com se key milegi. Ye GitHub pe kabhi upload nahi hoti — sirf isi browser me local rehti hai.</div>

      <button class="primary" id="saveSettings">Save 💛</button>
      <div class="hint" style="margin-top:10px;">Notifications ke liye upar 🔔 dabao aur permission allow karo. Ye tab khula rehne par hi kaam karega.</div>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const chatArea = $('chatArea');

  function loadState() {
    return JSON.parse(localStorage.getItem('petState') || '{}');
  }
  function saveState(s) {
    localStorage.setItem('petState', JSON.stringify(s));
  }
  let state = loadState();
  state.reminders = state.reminders || {};

  function addMsg(text, who = 'pet') {
    const div = document.createElement('div');
    div.className = who === 'pet' ? 'msg pet-msg' : who === 'user' ? 'msg user-msg' : 'system-msg';
    div.innerText = text;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  // ---------- Settings panel ----------
  $('gearBtn').onclick = () => {
    $('userName').value = state.name || '';
    $('userGender').value = state.gender || '';
    $('lastPeriod').value = state.lastPeriod || '';
    $('cycleLength').value = state.cycleLength || 28;
    $('waterHours').value = state.waterHours || 2;
    $('apiKey').value = state.apiKey || '';
    $('periodFields').style.display = state.gender === 'female' ? 'block' : 'none';
    $('overlay').classList.add('show');
  };
  $('closePanel').onclick = () => $('overlay').classList.remove('show');
  $('userGender').onchange = (e) => {
    $('periodFields').style.display = e.target.value === 'female' ? 'block' : 'none';
  };
  $('saveSettings').onclick = () => {
    state.name = $('userName').value.trim();
    state.gender = $('userGender').value;
    state.lastPeriod = $('lastPeriod').value;
    state.cycleLength = parseInt($('cycleLength').value) || 28;
    state.waterHours = parseInt($('waterHours').value) || 2;
    state.apiKey = $('apiKey').value.trim();
    saveState(state);
    $('overlay').classList.remove('show');
    $('petSub').innerText = state.name ? `${state.name} ka apna pet` : 'Hamesha tumhare saath hai';
    addMsg('Settings save ho gayi! 💛', 'pet');
  };

  // ---------- Notifications ----------
  $('notifBtn').onclick = async () => {
    if (!('Notification' in window)) { addMsg('Ye browser notifications support nahi karta.', 'system'); return; }
    const perm = await Notification.requestPermission();
    addMsg(perm === 'granted' ? 'Notifications on ho gaye 🔔' : 'Notifications allow nahi hui 😔', 'system');
  };
  function notify(title, body) {
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification(title, { body });
    }
    addMsg(body, 'pet');
  }

  // ---------- Canned lines (offline, always work even without API key) ----------
  const loveLines = ["I love you! Tum kamaal ho 💛", "Aaj bhi utna hi pyaar hai jitna kal tha 🍌💛", "Tumhe dekh ke smile aa jaati hai mujhe 😊"];
  const foodLines = ["Aaj khana khaya ki nahi? Batana zaroor 🍛", "Time pe khaana khana — pet ka order hai ye 😄"];
  const waterLines = ["Paani peene ka time ho gaya! 💧", "Ek glass paani abhi peelo na 💦"];

  function showOncePerDay(key, text) {
    if (state.reminders[key] === new Date().toDateString()) return;
    state.reminders[key] = new Date().toDateString();
    saveState(state);
    notify('Tumhara Pet 🍌', text);
  }

  function checkDailyReminders() {
    showOncePerDay('food', foodLines[Math.floor(Math.random() * foodLines.length)]);
    showOncePerDay('love', loveLines[Math.floor(Math.random() * loveLines.length)]);

    // Period reminder
    if (state.gender === 'female' && state.lastPeriod) {
      const last = new Date(state.lastPeriod);
      const cycle = state.cycleLength || 28;
      const next = new Date(last.getTime() + cycle * 86400000);
      const daysLeft = Math.ceil((next - new Date()) / 86400000);
      if (daysLeft === 2 || daysLeft === 1) {
        showOncePerDay('period-soon-' + daysLeft, `Heads up — periods ${daysLeft} din me aa sakte hain, ready rehna 🩷`);
      } else if (daysLeft === 0) {
        showOncePerDay('period-today', 'Aaj periods start ho sakte hain — apna khayal rakhna, garam paani aur rest lena 🩷');
      }
    }
  }

  function checkWaterReminder() {
    const hours = state.waterHours || 2;
    const last = state.lastWaterPing ? new Date(state.lastWaterPing) : null;
    if (!last || (new Date() - last) >= hours * 3600000) {
      state.lastWaterPing = new Date().toISOString();
      saveState(state);
      notify('Tumhara Pet 🍌', waterLines[Math.floor(Math.random() * waterLines.length)]);
    }
  }

  checkDailyReminders();
  setInterval(checkDailyReminders, 60 * 60 * 1000); // check every hour
  setInterval(checkWaterReminder, 15 * 60 * 1000);   // check every 15 min

  // ---------- Chat (AI if key present, else cute offline fallback) ----------
  const offlineReplies = [
    "Hehe main abhi offline mode me hoon, thoda simple baat kar sakta hoon 🍌",
    "Settings me apni API key daal do, phir hum aur khulke baat karenge 💛",
    "Main sun raha hoon! Bas full AI baat ke liye ⚙️ me key daalni hogi.",
  ];

  async function chatWithPet(userMsg) {
    if (!state.apiKey) {
      return offlineReplies[Math.floor(Math.random() * offlineReplies.length)];
    }
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': state.apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 200,
          system: `Tum ek pyaara, caring desktop pet ho jo ${state.name || 'apne dost'} ka sabse achha dost hai. Hamesha Hinglish (Hindi + English mix) me, chhote, warm, thodi si masti bhare replies do (2-3 lines max). Caring rehna par ek real dost jaisa — kabhi bhi fake ya over-the-top mat lagna. Agar user kisi mushkil waqt ki baat kare, unhe kisi trusted insaan ya professional se baat karne ke liye bhi encourage karna, khud ko unka sabse bada sahara mat batana.`,
          messages: [{ role: 'user', content: userMsg }],
        }),
      });
      const data = await res.json();
      const text = data?.content?.find((c) => c.type === 'text')?.text;
      return text || "Hmm, kuch gadbad ho gayi, phir se try karo.";
    } catch (err) {
      return "Abhi connect nahi ho pa raha, thodi der baad try karna.";
    }
  }

  $('sendBtn').onclick = sendMessage;
  $('textInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

  async function sendMessage() {
    const val = $('textInput').value.trim();
    if (!val) return;
    addMsg(val, 'user');
    $('textInput').value = '';
    addMsg('...', 'pet');
    const reply = await chatWithPet(val);
    chatArea.lastChild.remove();
    addMsg(reply, 'pet');
  }

  // Greet
  addMsg(state.name ? `Hi ${state.name}! Kaise ho aaj? 🍌💛` : 'Hi! Pehle ⚙️ me apna naam aur details daal do na 🍌', 'pet');
  if (!state.apiKey) addMsg('Tip: full AI baat karne ke liye ⚙️ Settings me apni API key daal do.', 'system');
</script>
</body>
</html>
